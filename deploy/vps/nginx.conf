# nginx / OpenResty site for the webcake-landing MCP server on a private-IP VPS.
# Drop into conf.d/ (or sites-enabled/), replace mcp.example.com + 10.0.0.5, reload.

upstream webcake_mcp {
    server 10.0.0.5:8787;      # private IP:port of the MCP VPS (BIND_IP:HOST_PORT)
    keepalive 16;
}

server {
    listen 80;
    server_name mcp.example.com;
    # Keep ACME http-01 working if you use certbot --webroot / lua-resty-auto-ssl.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;                   # nginx < 1.25.1 / older OpenResty: use `listen 443 ssl http2;` instead
    server_name mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;

    # create_page / patch_page payloads can be large.
    client_max_body_size 20m;

    location / {
        proxy_pass http://webcake_mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # REQUIRED: the server builds its public URL (OAuth issuer/callback, links)
        # from these — without them it advertises http://10.0.0.5:8787.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        # Streamable HTTP / SSE: no buffering, long-lived streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
